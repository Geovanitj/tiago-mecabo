  <!-- Script de Repasse de Parâmetros UTM (Original) -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      function getUTMParams() {
        const params = new URLSearchParams(window.location.search);
        let utmParams = {};
        const allowedParams = ["utm_source", "utm_campaign", "utm_medium", "utm_content", "ad_id"];

        allowedParams.forEach(param => {
          if (params.has(param)) {
            let key = param === "ad_id" ? "sck" : param;
            utmParams[key] = params.get(param);
          }
        });

        return utmParams;
      }

      function getEventId() {
        let eventId = null;

        try {
          const stapeData = localStorage.getItem("stape");
          if (stapeData) {
            const parsedData = JSON.parse(stapeData);
            if (parsedData.event_id) {
              eventId = parsedData.event_id;
            }
          }
        } catch (error) {
          console.error("Erro ao acessar event_id do localStorage:", error);
        }

        if (!eventId) {
          try {
            const sessionData = sessionStorage.getItem("stape");
            if (sessionData) {
              const parsedSessionData = JSON.parse(sessionData);
              if (parsedSessionData.event_id) {
                eventId = parsedSessionData.event_id;
              }
            }
          } catch (error) {
            console.error("Erro ao acessar event_id do sessionStorage:", error);
          }
        }

        if (!eventId) {
          eventId = getCookie("event_id");
        }

        return eventId;
      }

      function getCookie(name) {
        const cookies = document.cookie.split("; ");
        for (let cookie of cookies) {
          let [cookieName, cookieValue] = cookie.split("=");
          if (cookieName === name) {
            return cookieValue;
          }
        }
        return null;
      }

      function injectUTMToLinks() {
        const utmParams = getUTMParams();
        const eventId = getEventId();

        if (eventId) {
          if (utmParams["utm_content"]) {
            utmParams["utm_content"] += ";_;" + eventId;
          } else {
            utmParams["utm_content"] = eventId;
          }
        }

        if (Object.keys(utmParams).length === 0) return;

        document.querySelectorAll("a[href*='eduzz.com']").forEach((link) => {
          let url = new URL(link.href);
          let searchParams = new URLSearchParams(url.search);

          Object.entries(utmParams).forEach(([key, value]) => {
            searchParams.set(key, value);
          });

          url.search = searchParams.toString();
          link.href = url.toString();
        });
      }

      function observeLocalStorage() {
        const originalSetItem = localStorage.setItem;
        localStorage.setItem = function (key, value) {
          originalSetItem.apply(this, arguments);
          if (key === "stape") {
            injectUTMToLinks();
          }
        };
      }

      injectUTMToLinks();
      observeLocalStorage();
    });
  </script>
